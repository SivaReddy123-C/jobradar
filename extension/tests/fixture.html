<!doctype html><html><body>
<h1>Software Engineer</h1>
<div><h2>Location</h2><p>USA</p></div>
<form id="application">
<div class="ashby-application-form-field-entry" data-field-path="_systemfield_name"><label class="ashby-application-form-question-title" for="_systemfield_name">Name</label><input id="_systemfield_name" name="_systemfield_name" required></div>
<div class="ashby-application-form-field-entry" data-field-path="_systemfield_email"><label class="ashby-application-form-question-title" for="_systemfield_email">Email</label><input id="_systemfield_email" type="email" required></div>
<div class="ashby-application-form-field-entry" data-field-path="_systemfield_resume"><label class="ashby-application-form-question-title" for="_systemfield_resume">Resume</label><div class="ashby-application-form-input-file"><input id="_systemfield_resume" type="file" required></div></div>
<div class="ashby-application-form-field-entry" data-field-path="work"><label class="ashby-application-form-question-title _required_fixture">Are you authorized to work in the United States?</label><div class="ashby-application-form-input-yesno"><button type="button" data-option="yes" aria-pressed="false">Yes</button><button type="button" data-option="no" aria-pressed="false">No</button><input type="checkbox" name="work" tabindex="-1"></div></div>
<div class="ashby-application-form-field-entry" data-field-path="salary"><label class="ashby-application-form-question-title" for="salary">Expected annual base salary in USD</label><input id="salary" type="number" required></div>
<div class="ashby-application-form-field-entry" data-field-path="custom"><label class="ashby-application-form-question-title" for="custom">Describe a relevant project</label><textarea id="custom" required></textarea></div>
<div class="ashby-application-form-field-entry" data-field-path="notice"><label class="ashby-application-form-question-title" for="notice">Notice period</label><select id="notice" required><option value="">Choose</option><option value="two">2 weeks</option><option value="month">1 month</option></select></div>
<button type="submit">Submit Application</button>
</form>
<script>
window.submissions=0; window.uploads=0;
document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-option]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('[name=work]').checked=b.dataset.option==='yes';}));
document.querySelector('input[type=file]').addEventListener('change',()=>window.uploads++);
document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();window.submissions++;window.submittedEmail=document.querySelector('input[type=email]').value; if(!window.noConfirmation) {document.querySelector('form').remove();const h=document.createElement('h2');h.className='ashby-application-form-success';h.textContent='Application submitted';document.body.append(h);} });
</script></body></html>

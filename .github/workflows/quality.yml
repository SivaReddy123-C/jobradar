name: Quality checks
on:
  pull_request:
    paths: ["app/**", "extension/**", "supabase/**", "jobradar/scripts/**", "jobradar/src/**", "jobradar/tests/**", "jobradar/package*.json", "shared/**", ".github/workflows/quality.yml"]
  push:
    branches: [main, "feat/**"]
    paths: ["app/**", "extension/**", "supabase/**", "jobradar/scripts/**", "jobradar/src/**", "jobradar/tests/**", "jobradar/package*.json", "shared/**", ".github/workflows/quality.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [app, jobradar, extension]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - if: matrix.directory == 'jobradar'
        run: npm run build:discovery
      - if: matrix.directory == 'app' || matrix.directory == 'extension'
        run: npm run build
      - if: matrix.directory == 'extension'
        run: npx playwright install --with-deps chromium
      - if: matrix.directory == 'extension'
        run: npm run test:browser
      - if: matrix.directory == 'extension'
        run: npm --prefix ../app ci
      - if: matrix.directory == 'extension'
        run: |
          VITE_LOCAL_DISCOVERY=true npm --prefix ../app run dev > /tmp/jobradar-discovery-vite.log 2>&1 &
          discovery_pid=$!
          trap 'kill "$discovery_pid"' EXIT
          npm run test:discovery
      - if: matrix.directory == 'extension'
        run: |
          npm --prefix ../app run dev -- --port 5175 > /tmp/jobradar-hosted-vite.log 2>&1 &
          hosted_pid=$!
          trap 'kill "$hosted_pid"' EXIT
          JOBRADAR_TEST_URL=http://localhost:5175 npm run test:hosted-discovery

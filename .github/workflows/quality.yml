name: Quality checks
on:
  pull_request:
    paths: ["app/**", "extension/**", "jobradar/src/**", "jobradar/tests/**", "jobradar/package*.json", "shared/**", ".github/workflows/quality.yml"]
  push:
    branches: [main, "feat/**"]
    paths: ["app/**", "extension/**", "jobradar/src/**", "jobradar/tests/**", "jobradar/package*.json", "shared/**", ".github/workflows/quality.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [app, jobradar, extension]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - if: matrix.directory == 'app' || matrix.directory == 'extension'
        run: npm run build
      - if: matrix.directory == 'extension'
        run: npx playwright install --with-deps chromium
      - if: matrix.directory == 'extension'
        run: npm run test:browser
